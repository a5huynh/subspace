[package]
name = "subspace-server"
version = "0.1.0"
edition = "2024"

[dependencies]
subspace = { path = "../subspace" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# Timestamps
chrono = { version = "0.4", features = ["serde"] }

# Persistence
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }

# Logging
tracing = "0.1"
